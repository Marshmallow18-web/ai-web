global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "devsight-backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:4000"]

remote_write:
  - url: "http://backend:4000/api/ingest/prometheus"
    headers:
      X-API-Key: "devsight_key_demo_acme_prod_99182"

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devsight-ingress
  namespace: devsight-ai
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "15m"
spec:
  rules:
    - host: devsight.yourdomain.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: devsight-backend-svc
                port:
                  number: 4000
          - path: /v1/traces
            pathType: Prefix
            backend:
              service:
                name: devsight-backend-svc
                port:
                  number: 4000
          - path: /loki
            pathType: Prefix
            backend:
              service:
                name: devsight-backend-svc
                port:
                  number: 4000
          - path: /metrics
            pathType: Exact
            backend:
              service:
                name: devsight-backend-svc
                port:
                  number: 4000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devsight-frontend-svc
                port:
                  number: 80
  tls:
    - hosts:
        - devsight.yourdomain.com
      secretName: devsight-tls-cert
